[project]
name = "hermes-plugin-cursor-subscription-agentcli"
version = "0.1.0"
description = "Hermes Agent model-provider plugin: Cursor subscription through the official Cursor agent CLI (experimental)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No Python dependencies beyond Hermes core: the transport drives the `agent` executable directly.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: the repo root carries the plugin's __init__.py, which must not be collected as a package.
addopts = "-p no:cacheprovider --import-mode=importlib"
pythonpath = [".", "tests"]
